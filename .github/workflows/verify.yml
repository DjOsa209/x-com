name: Verify team workflows
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: x_ecommerce_test
          MYSQL_USER: x_ecommerce
          MYSQL_PASSWORD: ci-local-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: x_ecommerce_test
      MYSQL_USER: x_ecommerce
      MYSQL_PASSWORD: ci-local-only
      AUTH_REQUIRED: "false"
      COOKIE_SECURE: "false"
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:foundation
      - run: npm run test:backend
      - run: npm run test:commerce
      - run: npm run test:operations
      - run: npm run test:video
      - run: npm run test:storage
      - run: npx tsx scripts/e2e.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: docs/qa/screenshots
